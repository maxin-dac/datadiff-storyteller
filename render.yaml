services:
  - type: web
    name: datadiff-storyteller
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run Home.py --server.port=${PORT} --server.address=0.0.0.0 --server.headless true --browser.gatherUsageStats false"
    healthCheckPath: "/_stcore/health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PIP_NO_CACHE_DIR
        value: "1"
